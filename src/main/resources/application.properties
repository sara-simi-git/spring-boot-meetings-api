spring.application.name=MyApp

spring.datasource.url=jdbc:h2:./data/mydb;AUTO_SERVER=TRUE

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# [שינוי] כל הבלוק הבא חדש:
# [שינוי] jwt.secret - הסוד לחתימת ה-JWT. נלקח ממשתנה הסביבה JWT_SECRET, ואם אין כזה - ערך ברירת מחדל לפיתוח בלבד.
# [שינוי] חייב להיות באורך 32 תווים לפחות. בסביבה אמיתית חובה להחליף.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-real-use-0123456789}
# [שינוי] פרטי משתמש ה-admin ההתחלתי שנוצר בעלייה (ראה DataInitializer). ניתן לשינוי במשתני סביבה.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@example.com}

